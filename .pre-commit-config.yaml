# Local git hooks (pre-commit framework). Install once per clone: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Refuse commits on master/main. The hook has no message option; pre-commit prints `name`
      # in the "Failed" line, so it carries the instruction.
      - id: no-commit-to-branch
        name: "Do not commit on master: create a feature branch (git switch -c feat/...)"
        args: [--branch, master, --branch, main]
