# Smoke-test job. No cluster definition: tasks run on serverless compute.
resources:
  jobs:
    hello_job:
      name: hello_job
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      environments:
        # The energy_lakehouse wheel (databricks.yml artifacts) and its runtime dependencies.
        - environment_key: energy_lakehouse
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: hello
          environment_key: energy_lakehouse
          notebook_task:
            notebook_path: ../src/notebooks/hello.py
