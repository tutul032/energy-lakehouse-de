# Lakeflow Spark Declarative Pipeline: landing volume -> bronze -> silver -> gold.
# Serverless only (no clusters). Tables land in ${var.catalog}.${var.schema}; raw files are read
# from the shared volume ${var.landing_root} (the same for every target).
resources:
  pipelines:
    energy_pipeline:
      name: energy_pipeline
      serverless: true
      channel: CURRENT
      catalog: ${var.catalog}
      schema: ${var.schema}
      # Pipeline root folder (editor). Deliberately not ../src: root_path is added to sys.path, and
      # energy_lakehouse must come from the wheel below, not from the synced source files.
      root_path: ../src/pipelines
      # The energy_lakehouse wheel (databricks.yml artifacts; the CLI uploads it and replaces the
      # path), so pipeline code can `import energy_lakehouse` without sys.path manipulation.
      environment:
        dependencies:
          - ../dist/*.whl
      libraries:
        - glob:
            include: ../src/pipelines/**
      configuration:
        landing_path: ${var.landing_root}/smard
        weather_landing_path: ${var.landing_root}/weather
        # Timestamps are computed in UTC; local time is derived explicitly (Europe/Berlin).
        spark.sql.session.timeZone: UTC
