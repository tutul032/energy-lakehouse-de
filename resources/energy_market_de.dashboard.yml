resources:
  dashboards:
    energy_market_de:
      display_name: "Energy Market DE"
      warehouse_id: ${var.warehouse_id}
      file_path: ../src/energy_market_de.lvdash.json
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      embed_credentials: true
      # Only what the target permissions (databricks.yml) do not already grant: repeating the
      # CI/CD SP / alert_email CAN_MANAGE there triggers "already has permissions set" warnings.
      permissions:
        - group_name: energy-consumers
          level: CAN_READ
