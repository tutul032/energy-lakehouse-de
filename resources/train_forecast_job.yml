# Weekly training of the day-ahead forecasters (one task per target, run in parallel): each task
# trains on gold_energy_weather_hourly, logs to MLflow and registers
# ${var.catalog}.${var.schema}.forecaster_<target> in Unity Catalog; alias `champion` moves only
# if the new version beats the seasonal naive baseline (see src/notebooks/10_train_forecast.py).
# Schedule: Mondays 06:37 UTC (after the 05:17 daily refresh); development mode pauses it in dev.
# No cluster definition: tasks run on serverless compute. Libraries (scikit-learn, mlflow,
# holidays) come from the serverless environment `forecast` only (no %pip in the notebooks); the
# daily job's score_forecast uses the same pins. pandas/numpy are provided by the runtime.
resources:
  jobs:
    train_forecast_job:
      name: train_forecast_job
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 37 6 ? * MON"
        timezone_id: UTC
        pause_status: UNPAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      email_notifications:
        on_failure:
          - ${var.alert_email}
      environments:
        - environment_key: forecast
          spec:
            environment_version: "2"
            dependencies:
              - holidays==0.107
              - scikit-learn==1.9.1
              - mlflow==3.17.2
              - pydantic>=2.7
              - pyyaml>=6
      tasks:
        - task_key: train_load
          environment_key: forecast
          notebook_task:
            notebook_path: ../src/notebooks/10_train_forecast.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              target: total_load_mwh
        - task_key: train_price
          environment_key: forecast
          notebook_task:
            notebook_path: ../src/notebooks/10_train_forecast.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              target: price_eur_mwh
      permissions:
        - service_principal_name: ${var.refresh_sp_app_id}
          level: CAN_MANAGE_RUN
