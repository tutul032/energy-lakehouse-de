# Daily refresh: energy_pipeline update, quality checks on silver/gold, then the gold data
# contracts (contracts/*.yaml): apply comments/tags/grants, verify schema/quality/freshness;
# then the day-ahead forecast (score_forecast) and its accuracy (forecast_accuracy); finally
# ML-assisted data quality (detect_anomalies -> gold_dq_anomalies / gold_dq_daily_summary) and an
# optional LLM summary of it (dq_summary_llm, skipped while dq_llm_endpoint is empty).
# No schedule: GitHub Actions (.github/workflows/daily-refresh.yml) uploads fresh landing files
# and triggers this job via `databricks jobs run-now`, authenticated as the refresh service
# principal (OAuth M2M), which gets CAN_MANAGE_RUN in every target (staging/prod also grant
# CAN_MANAGE to the owner user and CI/CD SP via databricks.yml). No cluster definition: tasks run
# on serverless compute. The notebook tasks read the target schema from the job parameters.
resources:
  jobs:
    daily_refresh_job:
      name: daily_refresh_job
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        # "true" adds a marked TEST:total_load anomaly (dev schemas only; the notebook refuses
        # others). Override per run: --params inject_test_anomaly=true
        - name: inject_test_anomaly
          default: "false"
        # Model serving endpoint for ai_query (e.g. a Foundation Model API endpoint); empty = skip.
        - name: dq_llm_endpoint
          default: ""
      email_notifications:
        on_failure:
          - ${var.alert_email}
      environments:
        - environment_key: contracts
          spec:
            environment_version: "2"
            dependencies:
              - pydantic>=2.7
              - pyyaml>=6
        - environment_key: forecast
          spec:
            environment_version: "2"
            dependencies:
              - holidays==0.107
              - scikit-learn==1.9.1
              - mlflow==3.17.2
              - pydantic>=2.7
              - pyyaml>=6
      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.energy_pipeline.id}
            full_refresh: false
        - task_key: quality_checks
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../src/notebooks/03_quality_checks.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
        - task_key: apply_contracts
          depends_on:
            - task_key: quality_checks
          environment_key: contracts
          notebook_task:
            notebook_path: ../src/notebooks/04_apply_contracts.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
        - task_key: verify_contracts
          depends_on:
            - task_key: apply_contracts
          environment_key: contracts
          notebook_task:
            notebook_path: ../src/notebooks/05_verify_contracts.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
        # Day-ahead forecast for the local day D+1 with the champion models (train_forecast_job),
        # then accuracy of all past forecasts against the actuals.
        - task_key: score_forecast
          depends_on:
            - task_key: verify_contracts
          environment_key: forecast
          notebook_task:
            notebook_path: ../src/notebooks/11_score_forecast.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
        - task_key: forecast_accuracy
          depends_on:
            - task_key: score_forecast
          environment_key: forecast
          notebook_task:
            notebook_path: ../src/notebooks/12_forecast_accuracy.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
        # Anomaly detection needs scikit-learn (IsolationForest): same environment as forecasting.
        - task_key: detect_anomalies
          depends_on:
            - task_key: forecast_accuracy
          environment_key: forecast
          notebook_task:
            notebook_path: ../src/notebooks/20_detect_anomalies.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              inject_test_anomaly: "{{job.parameters.inject_test_anomaly}}"
        # ALL_DONE: also summarize when detect_anomalies failed on a critical anomaly (it writes
        # its tables before raising). The notebook itself never fails.
        - task_key: dq_summary_llm
          depends_on:
            - task_key: detect_anomalies
          run_if: ALL_DONE
          environment_key: forecast
          notebook_task:
            notebook_path: ../src/notebooks/21_dq_summary_llm.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              endpoint: "{{job.parameters.dq_llm_endpoint}}"
      permissions:
        - service_principal_name: ${var.refresh_sp_app_id}
          level: CAN_MANAGE_RUN
