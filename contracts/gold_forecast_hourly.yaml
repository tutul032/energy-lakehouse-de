# Data contract for gold_forecast_hourly (ODCS-inspired). Column names/types/descriptions must
# match GOLD_FORECAST_HOURLY_COLUMNS in src/energy_lakehouse/transforms.py (tests/test_contracts.py).
# Versioning (semver): remove/rename a column or change a type = MAJOR, add a column = MINOR,
# descriptions/rules/tags/status = PATCH. Regenerate docs: uv run python scripts/render_contract_docs.py
# status draft: apply_contracts/verify_contracts skip it until forecasts flow (champion trained and
# a few daily scoring runs done); then set status: active and bump the PATCH version.
apiVersion: v1
kind: DataContract
id: energy.gold_forecast_hourly
version: 0.1.0
status: draft
owner: {name: Rezaul Tutul, email: rezaul.tutul@yahoo.com}
description: "Day-ahead forecasts of total_load_mwh and price_eur_mwh: issued daily around 05:17 UTC on local day D for every hour of the Europe/Berlin day D+1, using only data available at issue time (champion model per target). One row per target_hour_utc, target and issue_date."
table: gold_forecast_hourly          # catalog/schema come from the target
object_type: table                   # Delta table written by 11_score_forecast (MERGE)
grain: one row per target_hour_utc, target and issue_date
primary_key: [target_hour_utc, target, issue_date]
tags: {layer: gold, domain: energy, data_product: energy_forecast_hourly, license: CC-BY-4.0, source: smard+open-meteo}
sla: {freshness_hours: 36, freshness_column: issue_time_utc, schedule: "daily ~05:17 UTC (score_forecast task)"}
consumers: [{group: energy-consumers, access: SELECT}]
columns:
  - {name: target_hour_utc, type: TIMESTAMP, nullable: false, description: "Start of the forecast hour (UTC)."}
  - {name: target_hour_local, type: TIMESTAMP_NTZ, nullable: false, description: "Start of the forecast hour, local wall-clock time (Europe/Berlin)."}
  - {name: target, type: STRING, nullable: false, description: "Forecast target: gold_energy_hourly column (total_load_mwh or price_eur_mwh)."}
  - {name: forecast, type: DOUBLE, nullable: false, description: "Forecast value in the target's unit (MWh or EUR/MWh)."}
  - {name: model_version, type: STRING, nullable: false, description: "Unity Catalog version of forecaster_<target> (alias champion) that made the forecast."}
  - {name: issue_time_utc, type: TIMESTAMP, nullable: false, description: "When the forecast was issued (UTC); only data available then was used."}
  - {name: issue_date, type: DATE, nullable: false, description: "Local (Europe/Berlin) issue day D; the forecast covers local day D+1."}
quality:
  - {name: unique_forecast, type: unique, columns: [target_hour_utc, target, issue_date]}
  - {name: known_target, type: row_condition, sql: "target IN ('total_load_mwh', 'price_eur_mwh')", max_violation_pct: 0}
  - {name: issued_before_target_hour, type: row_condition, sql: "target_hour_utc > issue_time_utc", max_violation_pct: 0}
  - {name: covers_next_local_day, type: row_condition, sql: "to_date(target_hour_local) = date_add(issue_date, 1)", max_violation_pct: 0}
  - {name: load_plausible, type: row_condition, sql: "target <> 'total_load_mwh' OR forecast BETWEEN 20000 AND 100000", max_violation_pct: 0}
  - {name: price_plausible, type: row_condition, sql: "target <> 'price_eur_mwh' OR forecast BETWEEN -500 AND 4000", max_violation_pct: 0}
