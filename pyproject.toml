[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-lakehouse-de"
version = "0.1.0"
description = "German energy data engineering on Databricks (SMARD + Open-Meteo)."
readme = "README.md"
# 3.11: serverless job environment_version "2" runs Python 3.11 (pip rejects the wheel
# otherwise); the pipeline and local dev/CI use 3.12.
requires-python = ">=3.11,<3.13"
# Base runtime dependencies of the wheel: enough for the extractors (requests), contracts and
# quality checks (pydantic, pyyaml). The extractor Docker image installs only these.
# Never list packages the Databricks serverless runtime provides (pyspark, databricks-connect,
# delta-spark, numpy, pandas, pyarrow): reinstalling them breaks Spark initialization.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
# Forecasting/ML (energy_lakehouse.forecast, notebooks 10-12, 20). Databricks job environments
# do not install the extra (`../dist/*.whl[ml]` is not a valid bundle glob); they pin exactly
# these packages to the uv.lock versions next to the wheel (tests/test_job_environments.py).
ml = [
    "holidays>=0.60",
    "mlflow>=2.16",
    "scikit-learn>=1.5",
]

[dependency-groups]
# Local only. pandas is provided by the Databricks runtime, so it is not a wheel dependency.
# The project's own ml extra, so `uv sync` installs everything the tests need.
dev = [
    "energy-lakehouse-de[ml]",
    "pandas>=2.2",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.6",
]

# Only the package goes into the wheel (no notebooks, pipelines, tests or contracts).
[tool.hatch.build.targets.wheel]
packages = ["src/energy_lakehouse"]

# contracts/ (repo root, the single source) ships in the wheel as package data;
# contracts.load_contracts() reads it via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"contracts" = "energy_lakehouse/contracts_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"  # oldest runtime: requires-python

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks and pipeline sources: `spark`/`dbutils` are injected globals.
"src/notebooks/*.py" = ["F821"]
"src/pipelines/*.py" = ["F821"]
