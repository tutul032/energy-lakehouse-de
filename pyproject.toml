[project]
name = "energy-lakehouse-de"
version = "0.1.0"
description = "German energy data engineering on Databricks (SMARD + Open-Meteo)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_lakehouse"]

[tool.uv]
# On Windows with Smart App Control, uv-managed Python builds can be blocked (os error 4551);
# the signed python.org build is used locally. CI (Linux) is unaffected.
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: `spark`/`dbutils` are injected globals; imports follow sys.path setup.
"src/notebooks/*.py" = ["F821", "E402"]
# Pipeline sources: `spark` is injected; energy_lakehouse imports follow the sys.path fallback.
"src/pipelines/*.py" = ["F821", "E402"]
