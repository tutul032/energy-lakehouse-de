name: deploy-staging

# After a merge to master: run the ci workflow (tests + bundle validate) as a gate, then deploy
# the staging target as the CI/CD service principal and run daily_refresh_job end to end.
# `databricks bundle run` waits for the run and exits non-zero if it fails.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CICD_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CICD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      # bundle deploy builds the energy_lakehouse wheel (databricks.yml artifacts:
      # uv build --wheel), so uv and Python 3.12 are needed on the runner.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@v1.23.0
      # Stdlib-only build (no uv/package install needed); file_path points at the built file.
      - name: Build dashboard file (staging)
        run: python3 scripts/build_dashboard.py --target staging
        env:
          PYTHONPATH: src
      - name: Deploy bundle (staging)
        run: databricks bundle deploy -t staging
      - name: Run daily_refresh_job (staging)
        run: databricks bundle run daily_refresh_job -t staging
