name: deploy-prod

# Deploy the prod target from a release tag (v*) as the CI/CD service principal.
#   publish-image: build the extractor image (Dockerfile) from the tag, Trivy scan, push
#                  ghcr.io/<owner>/energy-extractor:<tag> and :sha-<short sha>.
#   deploy:        `production` environment approval (Settings -> Environments), bundle deploy.
#   promote-image: retag the SAME digest as :prod (no rebuild); daily-refresh.yml runs :prod.
# Version tags are immutable: if :<tag> already exists (e.g. a manual rerun of a released tag),
# publish-image reuses its digest instead of rebuilding and overwriting it.
# The bundle job is not run here: daily-refresh.yml triggers the prod daily_refresh_job.
# Manual runs can set `force` to overwrite resources modified in the prod UI (`bundle deploy
# --force`, see docs/runbook.md "Dashboard modified remotely"); release runs never force.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v1.2.0)
        required: true
      force:
        description: Overwrite remote changes (bundle deploy --force); see docs/runbook.md
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-image:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.73.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      # Short SHA of the tagged commit (github.sha is the branch head on workflow_dispatch).
      # GHCR image names must be lowercase.
      - name: Image name and revision
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/energy-extractor"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE=${image}"
            echo "REVISION=$(git rev-parse HEAD)"
            echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Check whether the version tag exists
        id: existing
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${TAG} already exists; reusing its digest (no rebuild, no overwrite)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image
        if: steps.existing.outputs.exists != 'true'
        run: |
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:sha-${SHORT_SHA}" \
            --build-arg VERSION="${TAG}" --build-arg REVISION="${REVISION}" \
            --build-arg SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" .
          docker image ls "${IMAGE}"
      - name: Scan image (Trivy, fail on fixable CRITICAL)
        if: steps.existing.outputs.exists != 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}:${TAG}"
      - name: Push image
        if: steps.existing.outputs.exists != 'true'
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:sha-${SHORT_SHA}"
      - name: Record digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          [[ "${digest}" == sha256:* ]] || { echo "::error::no digest for ${IMAGE}:${TAG}" >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}:${TAG} = ${IMAGE}@${digest}"
          echo "Extractor image: \`${IMAGE}:${TAG}\` = \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish-image
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CICD_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CICD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      # bundle deploy builds the energy_lakehouse wheel (databricks.yml artifacts:
      # uv build --wheel), so uv and Python 3.12 are needed on the runner.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@v1.23.0
      # Stdlib-only build (no uv/package install needed); file_path points at the built file.
      - name: Build dashboard file (prod)
        run: python3 scripts/build_dashboard.py --target prod
        env:
          PYTHONPATH: src
      # inputs.force exists only on workflow_dispatch; a release event always deploys without it.
      - name: Deploy bundle (prod)
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::warning::Deploying with --force: remote changes in prod are overwritten."
            databricks bundle deploy -t prod --force
          else
            databricks bundle deploy -t prod
          fi
      - name: Bundle summary (prod)
        run: databricks bundle summary -t prod

  # Only after a successful prod deploy: point :prod at the digest publish-image recorded.
  promote-image:
    needs: [publish-image, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ${{ needs.publish-image.outputs.image }}
      DIGEST: ${{ needs.publish-image.outputs.digest }}
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Retag the published digest as :prod (no rebuild)
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          [[ -n "${IMAGE}" && "${DIGEST}" == sha256:* ]] || fail "publish-image gave no image/digest"
          current="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')" \
            || fail "${IMAGE}:${TAG} does not exist; refusing to promote"
          [[ "${current}" == "${DIGEST}" ]] \
            || fail "${IMAGE}:${TAG} is ${current}, but publish-image recorded ${DIGEST}"
          docker buildx imagetools create --tag "${IMAGE}:prod" "${IMAGE}@${DIGEST}"
          prod="$(docker buildx imagetools inspect "${IMAGE}:prod" --format '{{.Manifest.Digest}}')"
          [[ "${prod}" == "${DIGEST}" ]] || fail "${IMAGE}:prod is ${prod}, expected ${DIGEST}"
          echo "promoted ${IMAGE}:${TAG} (${DIGEST}) -> ${IMAGE}:prod"
          echo "Promoted \`${IMAGE}:${TAG}\` (\`${DIGEST}\`) to \`:prod\`" >> "$GITHUB_STEP_SUMMARY"
