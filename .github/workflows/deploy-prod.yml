name: deploy-prod

# Deploy the prod target from a release tag (v*) as the CI/CD service principal.
# The `production` environment requires an approval (Settings -> Environments). The job is not
# run here: daily-refresh.yml triggers the prod daily_refresh_job.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v1.2.0)
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CICD_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CICD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      - uses: databricks/setup-cli@main
      - name: Deploy bundle (prod)
        run: databricks bundle deploy -t prod
      - name: Bundle summary (prod)
        run: databricks bundle summary -t prod
